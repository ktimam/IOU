# pnpm-workspace.yaml — see ICTemplate/../pnpm-workspace.yaml for the
# full explanation. Same dual-version shim (pnpm 9 wants `packages: []`,
# pnpm 11 wants `allowBuilds` / `onlyBuiltDependencies`).

packages: []

overrides:
  hono: 4.12.34
  nanoid: 3.3.17

onlyBuiltDependencies:
  - esbuild
  - rollup

allowBuilds:
  esbuild: true
  rollup: true
