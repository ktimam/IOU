[package]
name = "iou_backend"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[features]
# Reserved for mainnet-only knobs (none today). The default build
# already includes the inspect_message hook — see lib.rs for why
# the v1.2.3 version works on both PocketIC and IC mainnet.
default = []

[dependencies]
candid = "0.10"
ic-cdk = "0.20"
ic-cdk-macros = "0.20"
ic-cdk-management-canister = "0.1"
ed25519-dalek = { version = "2", features = ["std"] }
serde = { version = "1", features = ["derive"] }

[profile.release]
opt-level = "z"
lto = true
