[package]
name = "iou_backend"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[features]
# Mainnet selects key_1 only when the vetKD stable cell is first created.
# Existing canisters retain their stored key name across every upgrade.
default = []
mainnet = []

[dependencies]
candid = "0.10"
ic-cdk = "0.20"
ic-cdk-macros = "0.20"
ic-cdk-management-canister = "0.1"
ed25519-dalek = { version = "2", features = ["std"] }
ic-stable-structures = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
opt-level = "z"
lto = true
