# Production-only IOU project; dfx.json remains the local development project.
# No Internet Identity, official OpenChat, registry, or extra inbox canister here.
# Build steps require reviewed IOU_MAINNET_CONFIG and explicit -e ic.
canisters:
  - name: iou_backend
    build:
      steps:
        - type: script
          command: node scripts/mainnet.mjs --build-backend
  - name: iou_assets
    build:
      steps:
        - type: script
          command: node scripts/mainnet.mjs --build-assets
        # Pin both public binaries. The recipe's default otherwise follows SDK latest.
        - type: pre-built
          url: https://github.com/dfinity/sdk/releases/download/0.32.0/assetstorage.wasm.gz
          sha256: 04e565b3425fe7510ee16b02adcfe3f01abc9a2725c82a21cb08969241debd62
    sync:
      steps:
        - type: plugin
          url: https://github.com/dfinity/certified-assets/releases/download/migration-v2.2.1-6b48585/sync_plugin.wasm
          sha256: ca7cb5666c30d2875f8d5e10535f8a53f97a86c79c263f7d5bdac2fdd1bbf83c
          dirs: [.icp/mainnet-build/dist]
environments:
  - name: ic
    network: ic
    canisters: [iou_backend, iou_assets]
